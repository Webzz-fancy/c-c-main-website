name: Project screenshots
on:
  push:
    branches: ['main']
    paths: ['scripts/shots/**', '.github/workflows/project-shots.yml']
  workflow_dispatch:
    inputs:
      only:
        description: 'comma separated slugs (empty = all)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.47.2-jammy
    steps:
      # pinned to a commit, so a moved tag can't change what runs with write access
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm init -y >/dev/null && npm i playwright@1.47.2 sharp@0.35.5 --no-audit --no-fund
        working-directory: scripts/shots
      - run: node scripts/shots/sites.mjs
        env:
          ONLY: ${{ github.event.inputs.only }}
      - run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add public/projects
          git commit -m "Project screenshots for the Simple page ring" || echo "nothing to commit"
          git push origin HEAD:main
