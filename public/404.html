<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#F8F5F0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>This page doesn't exist. | Clause &amp; Code</title>
    <style>
      @font-face {
        font-family: Inter;
        src: url('/fonts/inter-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: Inter;
        src: url('/fonts/inter-latin-600-normal.woff2') format('woff2');
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: 'Instrument Serif';
        src: url('/fonts/instrument-serif-latin-400-normal.woff2') format('woff2');
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Instrument Serif';
        src: url('/fonts/instrument-serif-latin-400-italic.woff2') format('woff2');
        font-style: italic;
        font-weight: 400;
        font-display: swap;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { color-scheme: light; }
      body { margin: 0; background: #F8F5F0; color: #1B1A17; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      .page { position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden; background: #F8F5F0; }
      .grain { position: absolute; inset: 0; pointer-events: none; opacity: .7; background-image: radial-gradient(rgba(27,26,23,.045) 1px, transparent 1px); background-size: 22px 22px; }
      .warm-light { position: absolute; top: -128px; right: -160px; width: 760px; height: 640px; border-radius: 50%; pointer-events: none; filter: blur(64px); background: radial-gradient(ellipse at center, rgba(225,173,52,.16), rgba(225,173,52,0) 68%); }
      /* Same unscrolled placement and logo size as src/components/Header.tsx. */
      .site-header { position: absolute; inset: 0 0 auto; z-index: 5; padding-top: 16px; }
      .header-inner { width: min(1440px, calc(100% - 80px)); height: 66px; margin: 0 auto; padding: 12px 8px; border: 1px solid transparent; display: flex; align-items: center; }
      .site-header a { display: inline-flex; flex-shrink: 0; align-items: center; }
      .site-header img { display: block; width: auto; height: 26px; transition: transform .3s ease; }
      .site-header a:hover img { transform: scale(1.03); }
      .site-header a:focus-visible, .home-link:focus-visible { outline: 3px solid #2D6D8B; outline-offset: 4px; }
      main {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1600px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0 auto;
        padding: 100px 6% 48px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, .82fr);
        align-items: center;
        gap: clamp(24px, 6vw, 100px);
      }
      .copy { max-width: 700px; }
      .label { margin: 0 0 16px; color: #6F6B62; font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; }
      h1 { margin: 0; color: #1B1A17; font: 400 clamp(40px, 4.6vw, 75.2px)/.92 'Instrument Serif', Georgia, serif; letter-spacing: -.03em; }
      h1 em { color: #A67821; font-style: italic; font-weight: 400; }
      .home-link {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 32px;
        padding: 11px 22px;
        border-radius: 999px;
        background: #E1AD34;
        color: #1B1A17;
        box-shadow: 0 14px 30px -12px rgba(225,173,52,.65);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background-color .3s ease, transform .3s ease;
      }
      .home-link:hover { background: #EBC96D; transform: translateY(-2px); }
      .visual { display: grid; place-items: center; min-width: 0; }
      .visual img { display: block; width: auto; max-width: 100%; height: min(76svh,680px); object-fit: contain; filter: drop-shadow(0 18px 24px rgba(27,26,23,.12)); }
      @media (min-width: 640px) { .site-header img { height: 28px; } }
      @media (min-width: 768px) { .site-header { padding-top: 20px; } .header-inner { height: 67px; } }
      @media (max-width: 700px) {
        main { display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 8px; padding: 96px 5% 26px; }
        .copy { width: 100%; }
        .home-link { margin-top: 24px; }
        .visual { align-self: center; width: 100%; }
        .visual img { height: clamp(210px, 41svh, 370px); }
        .warm-light { right: -280px; }
      }
      @media (prefers-reduced-motion: reduce) { .home-link, .site-header img { transition: none; } }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="grain" aria-hidden="true"></div>
      <div class="warm-light" aria-hidden="true"></div>
      <header class="site-header">

          <a href="/" aria-label="Clause &amp; Code — home"><img src="/logo.png" alt="Clause &amp; Code" width="432" height="160" /></a>
        </div>
      </header>
      <main>
        <div class="copy">
          <p class="label">Error 404</p>
          <h1>This page <br /><em>doesn't exist.</em></h1>
          <a class="home-link" href="/">Back home <span aria-hidden="true">→</span></a>
        </div>
        <div class="visual"><img src="/robot-404-puzzled.webp" alt="Clause &amp; Code robot scratching its head beside a question mark" width="652" height="1286" /></div>
      </main>
    </div>
  </body>
</html>
