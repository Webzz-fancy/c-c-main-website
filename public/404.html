<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#F8F5F0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>This page doesn't exist. | Clause &amp; Code</title>
    <style>
      @font-face {
        font-family: Inter;
        src: url('/fonts/inter-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Instrument Serif';
        src: url('/fonts/instrument-serif-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { color-scheme: light; }
      body { margin: 0; background: #F8F5F0; color: #1B1A17; font-family: Inter, Arial, sans-serif; }
      .page { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
      .site-header { width: min(100%, 1240px); margin: 0 auto; padding: 24px clamp(24px, 4vw, 52px); }
      .site-header a { display: inline-block; }
      .site-header img { display: block; width: 156px; height: auto; }
      main {
        width: min(100%, 1240px);
        flex: 1;
        margin: 0 auto;
        padding: 20px clamp(24px, 4vw, 52px) 60px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, .9fr);
        align-items: center;
        gap: clamp(24px, 5vw, 96px);
      }
      .label { margin: 0 0 20px; color: #2D6D8B; font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
      h1 { max-width: 660px; margin: 0; font: 400 clamp(64px, 7.1vw, 108px)/.96 'Instrument Serif', Georgia, serif; letter-spacing: -.045em; }
      .home-link {
        display: inline-flex;
        align-items: center;
        gap: 32px;
        margin-top: 38px;
        padding: 14px 21px;
        border-radius: 999px;
        background: #E1AD34;
        color: #1B1A17;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background-color .2s ease, transform .2s ease;
      }
      .home-link:hover { background: #f0c25b; transform: translateY(-2px); }
      .home-link:focus-visible, .site-header a:focus-visible { outline: 3px solid #2D6D8B; outline-offset: 4px; }
      .visual { position: relative; min-width: 0; display: grid; place-items: center; isolation: isolate; }
      .visual::before {
        content: '';
        position: absolute;
        z-index: -1;
        top: 55%;
        left: 50%;
        width: min(37vw, 420px);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: rgba(225, 173, 52, .17);
      }
      .visual img {
        display: block;
        width: auto;
        max-width: 100%;
        height: clamp(350px, 62vh, 610px);
        object-fit: contain;
        filter: drop-shadow(0 22px 26px rgba(27, 26, 23, .14));
      }
      @media (max-width: 700px) {
        .site-header { padding: 18px 24px; }
        .site-header img { width: 138px; }
        main { display: flex; flex-direction: column-reverse; justify-content: center; gap: 6px; padding: 8px 24px 38px; }
        .copy { text-align: center; }
        .label { margin-bottom: 12px; }
        h1 { font-size: clamp(48px, 10.5vw, 74px); line-height: .98; }
        .home-link { margin-top: 24px; }
        .visual { width: 100%; }
        .visual img { height: clamp(190px, 34svh, 300px); }
        .visual::before { width: min(60vw, 260px); }
      }
      @media (prefers-reduced-motion: reduce) { .home-link { transition: none; } }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a href="/" aria-label="Clause &amp; Code, home"><img src="/logo.png" alt="Clause &amp; Code" width="432" height="160" /></a>
      </header>
      <main>
        <div class="copy">
          <p class="label">Error 404</p>
          <h1>This page doesn't exist.</h1>
          <a class="home-link" href="/">Back home <span aria-hidden="true">↗</span></a>
        </div>
        <div class="visual"><img src="/robot-rope-idle.webp" alt="Clause &amp; Code robot holding its rope" width="706" height="1379" /></div>
      </main>
    </div>
  </body>
</html>
